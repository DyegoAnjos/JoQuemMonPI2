<div class="inventario-page">
  <!-- HEADER DO INVENTÁRIO -->
  <header class="topo-inventario">
    <button routerLink="/home" class="btn-voltar">← Voltar ao Menu</button>
    <h1>Meu Inventário</h1>
    <div class="acoes-topo">
      <button routerLink="/baralhos" class="btn-ver-baralhos">Meus Baralhos</button>
    </div>
  </header>

  <!-- GRADE DE CARTAS DO INVENTÁRIO -->
  <main class="conteudo-inventario">
    @if (carregando()) {
      <div class="estado-feedback">
        <p>Carregando suas cartas do banco de dados...</p>
      </div>
    } @else if (erroCarregamento()) {
      <div class="estado-feedback erro">
        <p>{{ erroCarregamento() }}</p>
        <button type="button" class="btn-tentar-novamente" (click)="carregarInventario()">
          Tentar novamente
        </button>
      </div>
    } @else if (minhasCartas().length === 0) {
      <div class="estado-feedback">
        <p>Você ainda não possui cartas no seu inventário.</p>
      </div>
    } @else {
      <div class="grid-cartas">
        @for (carta of minhasCartas(); track carta.id) {
          <app-carta [carta]="carta" [interativo]="false"></app-carta>
        }
      </div>
    }
  </main>
</div>
